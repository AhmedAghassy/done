name: done
description: "Manage your life."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^6.3.3
  get: ^4.7.3
  get_storage: ^2.1.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  date_picker_timeline: ^1.2.7
  flutter_svg: ^2.2.4
  animate_do: ^5.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  flutter_staggered_animations: ^1.1.1
  sqflite: ^2.4.2+1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5
  build_runner: ^2.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.jpeg"
  image_path_ios: "assets/images/appIcon.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/appIcon.jpeg"
  windows:
    generate: true
    image_path: "assets/images/appIcon.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/appIcon.jpeg"


flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.jpeg
    - assets/images/person.jpeg
    - assets/images/task.svg
    - assets/lang/en.json
    - assets/lang/ar.json

